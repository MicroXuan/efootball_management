[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "efm-wechat-bridge"
version = "0.1.0"
description = "Fail-closed Windows bridge for the EFM WeChat group bot"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
windows = ["wechatauto-replica==1.2.5.1"]
dev = ["pytest>=8.4,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/efm_wechat_bridge"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
default-groups = []

[dependency-groups]
dev = ["pytest>=8.4,<9"]
